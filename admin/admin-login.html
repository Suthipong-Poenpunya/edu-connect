<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #F05023;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .form-control {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #F05023;
            outline: none;
        }

        .btn-admin {
            background-color: #F05023;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 1em;
            width: 100%;
            transition: background-color 0.3s ease;
            color: white;
        }

        .btn-admin:hover {
            background-color: #e04515;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            color: #F05023;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #e04515;
            text-decoration: underline;
        }
        
        .error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .admin-badge {
            background-color: #F05023;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-badge">เข้าสู่ระบบสำหรับเจ้าหน้าที่</div>
        <h1>Admin Login</h1>
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input class="form-control" name="email" type="email" id="email" placeholder="กรุณาป้อนอีเมล" required>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input class="form-control" name="password" type="password" id="password" placeholder="กรุณาป้อนรหัสผ่าน" required>
            </div>
            <div class="form-group">
                <input type="submit" name="login" value="เข้าสู่ระบบ" class="btn-admin">
            </div>
        </form>
        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">กำลังเข้าสู่ระบบ...</div>
        <div class="back-link">
            <a href="../index.html">กลับไปหน้าหลัก</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDnZ-sh1RhmND1_N_drLOi9uL4KUdFpB0Q",
            authDomain: "edu-connect-a8315.firebaseapp.com",
            projectId: "edu-connect-a8315",
            storageBucket: "edu-connect-a8315.firebasestorage.app",
            messagingSenderId: "33042525923",
            appId: "1:33042525923:web:be51fde4766b06fd3a9fd6",
            measurementId: "G-QGG90GGG3Y"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Handle admin login form submission
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');
            
            // Show loading
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            
            try {
                // Sign in with Firebase Auth
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Check if user is admin in Firestore
                const adminDoc = await db.collection('admins').doc(user.uid).get();
                
                if (adminDoc.exists && adminDoc.data().role === 'admin') {
                    const adminData = adminDoc.data();
                    
                    // Store admin data in session
                    sessionStorage.setItem('currentAdmin', JSON.stringify({
                        uid: user.uid,
                        email: email,
                        name: adminData.name,
                        role: 'admin'
                    }));
                    
                    // Redirect to admin dashboard
                    window.location.href = 'admin-dashboard.html';
                } else {
                    throw new Error('คุณไม่มีสิทธิ์เข้าใช้งานในฐานะผู้ดูแลระบบ');
                }
                
            } catch (error) {
                console.error('Admin login error:', error);
                errorMessage.textContent = error.message || 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';
                errorMessage.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });

        // Check if admin is already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const currentAdmin = sessionStorage.getItem('currentAdmin');
                if (!currentAdmin) {
                    // Admin is logged in but no session data, get from Firestore
                    try {
                        const adminDoc = await db.collection('admins').doc(user.uid).get();
                        
                        if (adminDoc.exists && adminDoc.data().role === 'admin') {
                            const adminData = adminDoc.data();
                            sessionStorage.setItem('currentAdmin', JSON.stringify({
                                uid: user.uid,
                                email: user.email,
                                name: adminData.name,
                                role: 'admin'
                            }));
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            // User is not admin, sign out
                            auth.signOut();
                        }
                    } catch (error) {
                        console.error('Error getting admin data:', error);
                        auth.signOut();
                    }
                } else {
                    window.location.href = 'admin-dashboard.html';
                }
            }
        });

        function logout() {
            auth.signOut().then(() => {
                sessionStorage.removeItem('currentAdmin');
                window.location.href = '../index.html';
            }).catch((error) => {
                console.error('Logout error:', error);
                window.location.href = '../index.html';
            });
        }
    </script>
</body>
</html>
