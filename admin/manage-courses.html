<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการรายวิชา</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .logo {
            height: 40px;
            margin-right: 10px;
        }
        .navbar {
            background-color: rgb(222, 92, 142);
            color: white;
            padding: 15px 0;
        }
        .navbar-brand {
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .page-header {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        h1 {
            color: rgb(222, 92, 142);
            margin-bottom: 20px;
        }
        .course-form {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: rgb(222, 92, 142);
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 1em;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: rgb(200, 80, 130);
        }
        .btn-secondary {
            background-color: #6c757d;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 1em;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.9em;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-success {
            background-color: #28a745;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.9em;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .courses-table {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .table th,
        .table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .table th {
            background-color: rgb(222, 92, 142);
            color: white;
            font-weight: bold;
        }
        .table tr:hover {
            background-color: #f5f5f5;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .back-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background-color: #5a6268;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
        .error-message {
            color: red;
            text-align: center;
            margin: 20px 0;
        }
        .success-message {
            color: green;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center">
                    <img src="../images/Chula-LOGO.png" alt="Chula Logo" class="logo">
                    <div class="navbar-brand">EDU CU Connect</div>
                </div>
                <button class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="admin-dashboard.html" class="back-btn">← กลับไปหน้าแอดมิน</a>
        
        <div class="page-header">
            <h1>จัดการรายวิชา</h1>
            <p>เพิ่ม แก้ไข และลบรายวิชาในระบบ</p>
        </div>

        <div class="course-form">
            <h2>เพิ่มรายวิชาใหม่</h2>
            <form id="courseForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="courseCode">รหัสวิชา</label>
                            <input type="text" class="form-control" id="courseCode" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="courseName">ชื่อวิชา</label>
                            <input type="text" class="form-control" id="courseName" required>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="credits">หน่วยกิต</label>
                            <input type="number" class="form-control" id="credits" min="1" max="10" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="semester">ภาคการศึกษา</label>
                            <select class="form-control" id="semester" required>
                                <option value="">เลือกภาคการศึกษา</option>
                                <option value="1/2567">1/2567</option>
                                <option value="2/2567">2/2567</option>
                                <option value="1/2568">1/2568</option>
                                <option value="2/2568">2/2568</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="availableSeats">จำนวนที่รับ</label>
                            <input type="number" class="form-control" id="availableSeats" min="1" max="500" required>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="day">วันที่เรียน</label>
                            <select class="form-control" id="day" required>
                                <option value="">เลือกวัน</option>
                                <option value="MON">จันทร์</option>
                                <option value="TUE">อังคาร</option>
                                <option value="WED">พุธ</option>
                                <option value="THU">พฤหัสบดี</option>
                                <option value="FRI">ศุกร์</option>
                                <option value="SAT">เสาร์</option>
                                <option value="SUN">อาทิตย์</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="time">เวลาที่เรียน</label>
                            <input type="text" class="form-control" id="time" placeholder="เช่น 09:00 - 11:00" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">รายละเอียดวิชา</label>
                    <textarea class="form-control" id="description" rows="3" required></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="faculty">คณะ</label>
                            <input type="text" class="form-control" id="faculty" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="major">สาขาวิชา</label>
                            <input type="text" class="form-control" id="major" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">เพิ่มรายวิชา</button>
            </form>
        </div>

        <div class="courses-table">
            <h2>รายวิชาทั้งหมด</h2>
            <div id="loading" class="loading">กำลังโหลดข้อมูล...</div>
            <div id="coursesTableContainer" style="display: none;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>รหัสวิชา</th>
                            <th>ชื่อวิชา</th>
                            <th>หน่วยกิต</th>
                            <th>ภาคการศึกษา</th>
                            <th>วัน/เวลา</th>
                            <th>ที่รับ/ลงทะเบียน</th>
                            <th>การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="coursesBody">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDnZ-sh1RhmND1_N_drLOi9uL4KUdFpB0Q",
            authDomain: "edu-connect-a8315.firebaseapp.com",
            projectId: "edu-connect-a8315",
            storageBucket: "edu-connect-a8315.firebasestorage.app",
            messagingSenderId: "33042525923",
            appId: "1:33042525923:web:be51fde4766b06fd3a9fd6",
            measurementId: "G-QGG90GGG3Y"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check authentication
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Check if admin
                try {
                    const adminDoc = await db.collection('admins').doc(user.uid).get();
                    if (adminDoc.exists) {
                        loadCourses();
                    } else {
                        alert('คุณไม่มีสิทธิ์เข้าใช้งานในฐานะผู้ดูแลระบบ');
                        window.location.href = '../login.html';
                    }
                } catch (error) {
                    console.error('Error checking admin status:', error);
                    window.location.href = '../login.html';
                }
            } else {
                window.location.href = '../login.html';
            }
        });

        // Load courses
        async function loadCourses() {
            try {
                const coursesSnapshot = await db.collection('courses').get();
                const coursesBody = document.getElementById('coursesBody');
                const loading = document.getElementById('loading');
                const tableContainer = document.getElementById('coursesTableContainer');
                
                coursesBody.innerHTML = '';
                
                coursesSnapshot.forEach(doc => {
                    const course = doc.data();
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${course.courseCode}</td>
                        <td>${course.courseName}</td>
                        <td>${course.credits}</td>
                        <td>${course.semester}</td>
                        <td>${course.day} ${course.time}</td>
                        <td>${course.enrolledStudents || 0}/${course.availableSeats}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-success btn-sm" onclick="editCourse('${course.courseCode}')">แก้ไข</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteCourse('${course.courseCode}')">ลบ</button>
                            </div>
                        </td>
                    `;
                    coursesBody.appendChild(row);
                });
                
                loading.style.display = 'none';
                tableContainer.style.display = 'block';
                
            } catch (error) {
                console.error('Error loading courses:', error);
                document.getElementById('errorMessage').textContent = 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        // Handle course form submission
        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const courseData = {
                courseCode: document.getElementById('courseCode').value,
                courseName: document.getElementById('courseName').value,
                credits: parseInt(document.getElementById('credits').value),
                semester: document.getElementById('semester').value,
                year: '2567',
                faculty: document.getElementById('faculty').value,
                major: document.getElementById('major').value,
                availableSeats: parseInt(document.getElementById('availableSeats').value),
                enrolledStudents: 0,
                day: document.getElementById('day').value,
                time: document.getElementById('time').value,
                description: document.getElementById('description').value,
                teacher: 'อาจารย์ผู้สอน',
                room: 'ห้องเรียน'
            };
            
            try {
                await db.collection('courses').doc(courseData.courseCode).set(courseData);
                
                document.getElementById('successMessage').textContent = 'เพิ่มรายวิชาสำเร็จแล้ว';
                document.getElementById('successMessage').style.display = 'block';
                
                // Reset form
                document.getElementById('courseForm').reset();
                
                // Reload courses
                loadCourses();
                
                // Hide success message after 3 seconds
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 3000);
                
            } catch (error) {
                console.error('Error adding course:', error);
                document.getElementById('errorMessage').textContent = 'เกิดข้อผิดพลาดในการเพิ่มรายวิชา';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });

        // Edit course
        function editCourse(courseCode) {
            // For now, just show a simple prompt
            const newName = prompt('กรุณากรอกชื่อรายวิชาใหม่:');
            if (newName && newName.trim()) {
                updateCourseName(courseCode, newName.trim());
            }
        }

        // Delete course
        function deleteCourse(courseCode) {
            if (confirm(`คุณต้องการลบรายวิชา ${courseCode} หรือไม่? การกระทำนี้ไม่สามารถย้อนกลับได้`)) {
                deleteCourseFromFirestore(courseCode);
            }
        }

        async function updateCourseName(courseCode, newName) {
            try {
                await db.collection('courses').doc(courseCode).update({
                    courseName: newName
                });
                alert('อัปเดตชื่อรายวิชาสำเร็จแล้ว');
                loadCourses();
            } catch (error) {
                console.error('Error updating course:', error);
                alert('เกิดข้อผิดพลาดในการอัปเดตข้อมูลรายวิชา');
            }
        }

        async function deleteCourseFromFirestore(courseCode) {
            try {
                await db.collection('courses').doc(courseCode).delete();
                alert(`ลบรายวิชา ${courseCode} สำเร็จแล้ว`);
                loadCourses();
            } catch (error) {
                console.error('Error deleting course:', error);
                alert('เกิดข้อผิดพลาดในการลบข้อมูลรายวิชา');
            }
        }

        function logout() {
            auth.signOut().then(() => {
                sessionStorage.removeItem('currentAdmin');
                window.location.href = '../login.html';
            }).catch((error) => {
                console.error('Logout error:', error);
                window.location.href = '../login.html';
            });
        }
    </script>
</body>
</html>
