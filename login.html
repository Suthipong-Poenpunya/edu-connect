<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
      body {
        font-family: 'Kanit', sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 10px;
      }
      .test-message {
        color: gray;
        text-align: center;
        margin-top: 10px;
        font-size: 0.9em;
      }
      
      .logo {
        height: 40px;
        margin-right: 10px;
      }

      .container {
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        width: 100%;
        max-width: 400px;
      }

      h1 {
        color:rgb(222, 92, 142);
        text-align: center;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
      }

      .form-control {
        border-radius: 5px;
        border: 1px solid #ddd;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
        transition: border-color 0.3s ease;
      }

      .form-control:focus {
        border-color:rgb(222, 92, 142);
        outline: none;
      }

      .btn-success {
        background-color:rgb(222, 92, 142);
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 1em;
        width: 100%;
        transition: background-color 0.3s ease;
      }

      .btn-success:hover {
        background-color:rgb(200, 80, 130);
      }

      .register-link {
        margin-top: 15px;
        text-align: center;
      }

      .register-link a {
        color:rgb(222, 92, 142);
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .register-link a:hover {
        color:rgb(222, 92, 142);
        text-decoration: underline;
      }
      
      .error-message {
        color: red;
        text-align: center;
        margin-top: 10px;
        display: none;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 10px;
      }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center">
                    <img src="images/Chula-LOGO.png" alt="Chula Logo" class="logo">
                    <div class="navbar-brand">EDU CU Connect</div>
                </div>
                <a href="index.html" class="btn btn-secondary">กลับหน้าแรก</a>
            </div>
        </div>
    </nav>
    <div class="container">
    <div class="logo-container">
    <h1>ยินดีต้อนรับ</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="student_code">รหัสนิสิต</label>
                <input class="form-control" name="student_code" type="text" id="student_code" placeholder="กรุณาป้อนรหัสนิสิต" required>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input class="form-control" name="password" type="password" id="password" placeholder="กรุณาป้อนรหัสผ่าน" required>
            </div>
            <div class="form-group">
                <input type="submit" name="login" value="เข้าสู่ระบบ" class="btn btn-success">
            </div>
        </form>
        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">กำลังเข้าสู่ระบบ...</div>
        <div class="register-link">
               <a href="register_student.html">ลงทะเบียนสำหรับนิสิตใหม่</a>
        </div>
        <div class="test-message" id="test-login" name="test-login">สำหรับทดสอบใช้งาน กรุณาป้อนรหัสนิสิต 6740000027 และรหัสผ่าน password123</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDnZ-sh1RhmND1_N_drLOi9uL4KUdFpB0Q",
            authDomain: "edu-connect-a8315.firebaseapp.com",
            projectId: "edu-connect-a8315",
            storageBucket: "edu-connect-a8315.firebasestorage.app",
            messagingSenderId: "33042525923",
            appId: "1:33042525923:web:be51fde4766b06fd3a9fd6",
            measurementId: "G-QGG90GGG3Y"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const studentCode = document.getElementById('student_code').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');
            
            // Show loading
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            
            try {
                // Create email from student code (assuming format: studentcode@chula.ac.th)
                const email = `${studentCode}@chula.ac.th`;
                
                // Sign in with Firebase Auth
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Get user data from Firestore
                const userDoc = await db.collection('students').doc(studentCode).get();
                
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    
                    // Store user data in session
                    sessionStorage.setItem('currentUser', JSON.stringify({
                        studentCode: studentCode,
                        name: userData.name,
                        email: email,
                        role: 'student'
                    }));
                    
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error('ไม่พบข้อมูลนิสิต');
                }
                
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';
                errorMessage.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });

        // Check if user is already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const currentUser = sessionStorage.getItem('currentUser');
                if (!currentUser) {
                    // User is logged in but no session data, get from Firestore
                    try {
                        const studentCode = user.email.split('@')[0];
                        const userDoc = await db.collection('students').doc(studentCode).get();
                        
                        if (userDoc.exists) {
                            const userData = userDoc.data();
                            sessionStorage.setItem('currentUser', JSON.stringify({
                                studentCode: studentCode,
                                name: userData.name,
                                email: user.email,
                                role: 'student'
                            }));
                            window.location.href = 'dashboard.html';
                        }
                    } catch (error) {
                        console.error('Error getting user data:', error);
                    }
                } else {
                    window.location.href = 'dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
