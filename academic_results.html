<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: rgb(222, 92, 142);
            color: white;
            padding: 15px 0;
        }
        .navbar-brand {
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .page-header {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        h1 {
            color: rgb(222, 92, 142);
            margin-bottom: 20px;
        }
        .results-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .semester-selector {
            margin-bottom: 30px;
            text-align: center;
        }
        .semester-selector select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 1em;
            margin-left: 10px;
        }
        .gpa-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .gpa-card {
            background: linear-gradient(135deg, rgb(222, 92, 142), rgb(180, 70, 120));
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .gpa-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .gpa-label {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .results-table th,
        .results-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .results-table th {
            background-color: rgb(222, 92, 142);
            color: white;
            font-weight: bold;
        }
        .results-table .course-code {
            text-align: left;
            font-weight: bold;
        }
        .results-table .course-name {
            text-align: left;
        }
        .grade-a { color: #28a745; font-weight: bold; }
        .grade-b-plus { color: #17a2b8; font-weight: bold; }
        .grade-b { color: #20c997; font-weight: bold; }
        .grade-c-plus { color: #fd7e14; font-weight: bold; }
        .grade-c { color: #ffc107; font-weight: bold; }
        .grade-d-plus { color: #e83e8c; font-weight: bold; }
        .grade-d { color: #dc3545; font-weight: bold; }
        .grade-f { color: #6f42c1; font-weight: bold; }
        .back-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background-color: #5a6268;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
        .error-message {
            color: red;
            text-align: center;
            margin: 20px 0;
        }
        .no-data {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .print-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            float: right;
            margin-bottom: 10px;
        }
        .print-btn:hover {
            background-color: #218838;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-passed {
            background-color: #d4edda;
            color: #155724;
        }
        .status-failed {
            background-color: #f8d7da;
            color: #721c24;
        }
        .status-ongoing {
            background-color: #fff3cd;
            color: #856404;
        }
        @media print {
            .navbar, .back-btn, .print-btn, .semester-selector {
                display: none;
            }
            .results-container {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="navbar-brand">EDU CU Connect</div>
                <button class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="dashboard.html" class="back-btn">← กลับไปหน้าหลัก</a>
        
        <div class="page-header">
            <h1>ผลการเรียน</h1>
            <div id="userInfo">กำลังโหลดข้อมูล...</div>
        </div>

        <div class="results-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="semester-selector">
                    <label for="semesterSelect"><strong>ภาคการศึกษา:</strong></label>
                    <select id="semesterSelect" onchange="loadResults()">
                        <option value="2/2567">2/2567</option>
                        <option value="1/2567">1/2567</option>
                        <option value="2/2566">2/2566</option>
                        <option value="1/2566">1/2566</option>
                        <option value="all">ทุกภาคการศึกษา</option>
                    </select>
                </div>
                <button class="print-btn" onclick="window.print()">🖨️ พิมพ์ผลการเรียน</button>
            </div>
            
            <div class="loading" id="loading">กำลังโหลดผลการเรียน...</div>
            <div id="resultsContent" style="display: none;">
                <div class="gpa-summary" id="gpaSummary">
                </div>
                
                <div id="resultsTableContainer">
                    <table class="results-table" id="resultsTable">
                        <thead>
                            <tr>
                                <th>รหัสวิชา</th>
                                <th>ชื่อวิชา</th>
                                <th>หน่วยกิต</th>
                                <th>เกรด</th>
                                <th>คะแนน</th>
                                <th>สถานะ</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDnZ-sh1RhmND1_N_drLOi9uL4KUdFpB0Q",
            authDomain: "edu-connect-a8315.firebaseapp.com",
            projectId: "edu-connect-a8315",
            storageBucket: "edu-connect-a8315.firebasestorage.app",
            messagingSenderId: "33042525923",
            appId: "1:33042525923:web:be51fde4766b06fd3a9fd6",
            measurementId: "G-QGG90GGG3Y"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let allResults = [];

        // Grade point mapping
        const gradePoints = {
            'A': 4.0,
            'B+': 3.5,
            'B': 3.0,
            'C+': 2.5,
            'C': 2.0,
            'D+': 1.5,
            'D': 1.0,
            'F': 0
        };

        // Check authentication and load data
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const currentUserData = sessionStorage.getItem('currentUser');
                if (currentUserData) {
                    currentUser = JSON.parse(currentUserData);
                    loadUserData();
                    await loadResults();
                } else {
                    // Get user data from Firestore
                    try {
                        const studentCode = user.email.split('@')[0];
                        const userDoc = await db.collection('students').doc(studentCode).get();
                        
                        if (userDoc.exists) {
                            const userData = userDoc.data();
                            const sessionData = {
                                studentCode: studentCode,
                                name: userData.name,
                                email: user.email,
                                role: 'student'
                            };
                            sessionStorage.setItem('currentUser', JSON.stringify(sessionData));
                            currentUser = sessionData;
                            loadUserData();
                            await loadResults();
                        } else {
                            console.error('User document not found');
                            logout();
                        }
                    } catch (error) {
                        console.error('Error getting user data:', error);
                        logout();
                    }
                }
            } else {
                // Not logged in, redirect to login page
                window.location.href = 'login.html';
            }
        });

        function loadUserData() {
            document.getElementById('userInfo').innerHTML = `
                <p><strong>รหัสนิสิต:</strong> ${currentUser.studentCode}</p>
                <p><strong>ชื่อ:</strong> ${currentUser.name}</p>
            `;
        }

        async function loadResults() {
            try {
                const semester = document.getElementById('semesterSelect').value;
                
                // Load academic results
                let resultsQuery = db.collection('academic_results')
                    .where('studentCode', '==', currentUser.studentCode);
                
                if (semester !== 'all') {
                    resultsQuery = resultsQuery.where('semester', '==', semester);
                }
                
                const resultsSnapshot = await resultsQuery.get();
                
                allResults = [];
                resultsSnapshot.forEach(doc => {
                    const result = doc.data();
                    result.id = doc.id;
                    allResults.push(result);
                });
                
                // Sort by semester and course code
                allResults.sort((a, b) => {
                    if (semester === 'all') {
                        if (a.semester !== b.semester) {
                            return b.semester.localeCompare(a.semester);
                        }
                    }
                    return a.courseCode.localeCompare(b.courseCode);
                });
                
                displayResults();
                
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('errorMessage').textContent = 'เกิดข้อผิดพลาดในการโหลดผลการเรียน';
                document.getElementById('errorMessage').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultsContent').style.display = 'block';
            }
        }

        function displayResults() {
            if (allResults.length === 0) {
                document.getElementById('resultsTableContainer').innerHTML = `
                    <div class="no-data">
                        <h3>ไม่พบข้อมูลผลการเรียน</h3>
                        <p>ยังไม่มีข้อมูลผลการเรียนสำหรับภาคการศึกษาที่เลือก</p>
                    </div>
                `;
                document.getElementById('gpaSummary').innerHTML = '';
                return;
            }
            
            // Calculate GPA
            const gpaData = calculateGPA();
            displayGPASummary(gpaData);
            
            // Display results table
            const resultsBody = document.getElementById('resultsBody');
            resultsBody.innerHTML = '';
            
            let currentSemester = '';
            allResults.forEach(result => {
                // Add semester header if showing all semesters
                if (document.getElementById('semesterSelect').value === 'all' && 
                    result.semester !== currentSemester) {
                    currentSemester = result.semester;
                    const semesterRow = document.createElement('tr');
                    semesterRow.innerHTML = `
                        <td colspan="6" style="background-color: #f8f9fa; font-weight: bold; text-align: center;">
                            ภาคการศึกษา ${currentSemester}
                        </td>
                    `;
                    resultsBody.appendChild(semesterRow);
                }
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="course-code">${result.courseCode}</td>
                    <td class="course-name">${result.courseName}</td>
                    <td>${result.credits}</td>
                    <td class="grade-${result.grade.toLowerCase().replace('+', '-plus')}">${result.grade}</td>
                    <td>${result.score || '-'}</td>
                    <td>
                        <span class="status-badge ${getStatusClass(result.grade)}">
                            ${getStatusText(result.grade)}
                        </span>
                    </td>
                `;
                resultsBody.appendChild(row);
            });
        }

        function calculateGPA() {
            let totalCredits = 0;
            let totalGradePoints = 0;
            let totalCourses = allResults.length;
            let passedCourses = 0;
            let failedCourses = 0;
            
            allResults.forEach(result => {
                const credits = result.credits || 0;
                const gradePoint = gradePoints[result.grade] || 0;
                
                totalCredits += credits;
                totalGradePoints += credits * gradePoint;
                
                if (result.grade !== 'F') {
                    passedCourses++;
                } else {
                    failedCourses++;
                }
            });
            
            const gpa = totalCredits > 0 ? (totalGradePoints / totalCredits).toFixed(2) : '0.00';
            
            return {
                gpa: gpa,
                totalCredits: totalCredits,
                totalCourses: totalCourses,
                passedCourses: passedCourses,
                failedCourses: failedCourses
            };
        }

        function displayGPASummary(gpaData) {
            const gpaSummary = document.getElementById('gpaSummary');
            gpaSummary.innerHTML = `
                <div class="gpa-card">
                    <div class="gpa-number">${gpaData.gpa}</div>
                    <div class="gpa-label">เกรดเฉลี่ย (GPA)</div>
                </div>
                <div class="gpa-card">
                    <div class="gpa-number">${gpaData.totalCredits}</div>
                    <div class="gpa-label">หน่วยกิตรวม</div>
                </div>
                <div class="gpa-card">
                    <div class="gpa-number">${gpaData.totalCourses}</div>
                    <div class="gpa-label">รายวิชาทั้งหมด</div>
                </div>
                <div class="gpa-card">
                    <div class="gpa-number">${gpaData.passedCourses}</div>
                    <div class="gpa-label">วิชาที่ผ่าน</div>
                </div>
            `;
        }

        function getStatusClass(grade) {
            if (grade === 'F') return 'status-failed';
            if (grade === 'I' || grade === 'W') return 'status-ongoing';
            return 'status-passed';
        }

        function getStatusText(grade) {
            if (grade === 'F') return 'ไม่ผ่าน';
            if (grade === 'I') return 'ไม่สมบูรณ์';
            if (grade === 'W') return 'ถอน';
            return 'ผ่าน';
        }

        function logout() {
            auth.signOut().then(() => {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }).catch((error) => {
                console.error('Logout error:', error);
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
