<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .logo {
            height: 40px;
            margin-right: 10px;
        }
        .navbar {
            background-color: rgb(222, 92, 142);
            color: white;
            padding: 15px 0;
        }
        .navbar-brand {
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .page-header {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        h1 {
            color: rgb(222, 92, 142);
            margin-bottom: 20px;
        }
        .schedule-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .schedule-table th,
        .schedule-table td {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            vertical-align: top;
        }
        .schedule-table th {
            background-color: rgb(222, 92, 142);
            color: white;
            font-weight: bold;
        }
        .schedule-table .time-slot {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #495057;
            min-width: 120px;
        }
        .course-cell {
            background-color: #fff;
            border-left: 4px solid rgb(222, 92, 142);
            padding: 10px;
            min-height: 80px;
        }
        .course-cell.empty {
            border-left: 4px solid transparent;
        }
        .course-code {
            font-weight: bold;
            color: rgb(222, 92, 142);
            margin-bottom: 5px;
        }
        .course-name {
            font-size: 0.9em;
            color: #333;
            margin-bottom: 5px;
        }
        .course-time {
            font-size: 0.8em;
            color: #666;
        }
        .course-room {
            font-size: 0.8em;
            color: #666;
            font-style: italic;
        }
        .summary-section {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .summary-item {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
        }
        .summary-number {
            font-size: 2em;
            font-weight: bold;
            color: rgb(222, 92, 142);
            margin-bottom: 10px;
        }
        .summary-label {
            color: #666;
        }
        .back-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background-color: #5a6268;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
        .error-message {
            color: red;
            text-align: center;
            margin: 20px 0;
        }
        .semester-selector {
            margin-bottom: 20px;
        }
        .semester-selector select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 1em;
        }
        .print-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            float: right;
            margin-bottom: 10px;
        }
        .print-btn:hover {
            background-color: #218838;
        }
        @media print {
            .navbar, .back-btn, .print-btn, .semester-selector {
                display: none;
            }
            .schedule-container {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center">
                    <img src="images/Chula-LOGO.png" alt="Chula Logo" class="logo">
                    <div class="navbar-brand">EDU CU Connect</div>
                </div>
                <button class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="dashboard.html" class="back-btn">← กลับไปหน้าหลัก</a>
        
        <div class="page-header">
            <h1>ตารางเรียน</h1>
            <div id="userInfo">กำลังโหลดข้อมูล...</div>
        </div>

        <div class="schedule-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="semester-selector">
                    <label for="semesterSelect"><strong>ภาคการศึกษา:</strong></label>
                    <select id="semesterSelect" onchange="loadSchedule()">
                        <option value="2/2567">2/2567</option>
                        <option value="1/2567">1/2567</option>
                        <option value="2/2566">2/2566</option>
                        <option value="1/2566">1/2566</option>
                    </select>
                </div>
                <button class="print-btn" onclick="window.print()">🖨️ พิมพ์ตารางเรียน</button>
            </div>
            
            <div class="loading" id="loading">กำลังโหลดตารางเรียน...</div>
            <div id="scheduleContent" style="display: none;">
                <table class="schedule-table" id="scheduleTable">
                    <thead>
                        <tr>
                            <th>เวลา</th>
                            <th>จันทร์</th>
                            <th>อังคาร</th>
                            <th>พุธ</th>
                            <th>พฤหัส</th>
                            <th>ศุกร์</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="summary-section">
            <h3>สรุปการลงทะเบียน</h3>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-number" id="totalCourses">0</div>
                    <div class="summary-label">รายวิชาทั้งหมด</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number" id="totalCredits">0</div>
                    <div class="summary-label">หน่วยกิตรวม</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number" id="totalHours">0</div>
                    <div class="summary-label">ชั่วโมงต่อสัปดาห์</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number" id="freeDays">5</div>
                    <div class="summary-label">วันว่าง</div>
                </div>
            </div>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDnZ-sh1RhmND1_N_drLOi9uL4KUdFpB0Q",
            authDomain: "edu-connect-a8315.firebaseapp.com",
            projectId: "edu-connect-a8315",
            storageBucket: "edu-connect-a8315.firebasestorage.app",
            messagingSenderId: "33042525923",
            appId: "1:33042525923:web:be51fde4766b06fd3a9fd6",
            measurementId: "G-QGG90GGG3Y"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let registeredCourses = [];
        let allCourses = [];

        // Time slots for schedule
        const timeSlots = [
            '08:00 - 09:00',
            '09:00 - 10:00',
            '10:00 - 11:00',
            '11:00 - 12:00',
            '12:00 - 13:00',
            '13:00 - 14:00',
            '14:00 - 15:00',
            '15:00 - 16:00',
            '16:00 - 17:00',
            '17:00 - 18:00',
            '18:00 - 19:00',
            '19:00 - 20:00',
            '20:00 - 21:00'
        ];

        const dayMapping = {
            'MO': 'จันทร์',
            'TU': 'อังคาร',
            'WE': 'พุธ',
            'TH': 'พฤหัส',
            'FR': 'ศุกร์'
        };

        // Check authentication and load data
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const currentUserData = sessionStorage.getItem('currentUser');
                if (currentUserData) {
                    currentUser = JSON.parse(currentUserData);
                    loadUserData();
                    await loadSchedule();
                } else {
                    // Get user data from Firestore
                    try {
                        const studentCode = user.email.split('@')[0];
                        const userDoc = await db.collection('students').doc(studentCode).get();
                        
                        if (userDoc.exists) {
                            const userData = userDoc.data();
                            const sessionData = {
                                studentCode: studentCode,
                                name: userData.name,
                                email: user.email,
                                role: 'student'
                            };
                            sessionStorage.setItem('currentUser', JSON.stringify(sessionData));
                            currentUser = sessionData;
                            loadUserData();
                            await loadSchedule();
                        } else {
                            console.error('User document not found');
                            logout();
                        }
                    } catch (error) {
                        console.error('Error getting user data:', error);
                        logout();
                    }
                }
            } else {
                // Not logged in, redirect to login page
                window.location.href = 'login.html';
            }
        });

        function loadUserData() {
            document.getElementById('userInfo').innerHTML = `
                <p><strong>รหัสนิสิต:</strong> ${currentUser.studentCode}</p>
                <p><strong>ชื่อ:</strong> ${currentUser.name}</p>
            `;
        }

        async function loadSchedule() {
            try {
                const semester = document.getElementById('semesterSelect').value;
                
                // Load registered courses
                const registrationsSnapshot = await db.collection('registrations')
                    .where('studentCode', '==', currentUser.studentCode)
                    .where('semester', '==', semester)
                    .get();
                
                registeredCourses = [];
                registrationsSnapshot.forEach(doc => {
                    const registration = doc.data();
                    registeredCourses.push(registration.courseId);
                });
                
                // Load all courses
                const coursesSnapshot = await db.collection('courses')
                    .where('semester', '==', semester)
                    .get();
                
                allCourses = [];
                coursesSnapshot.forEach(doc => {
                    const course = doc.data();
                    course.id = doc.id;
                    allCourses.push(course);
                });
                
                displaySchedule();
                updateSummary();
                
            } catch (error) {
                console.error('Error loading schedule:', error);
                document.getElementById('errorMessage').textContent = 'เกิดข้อผิดพลาดในการโหลดตารางเรียน';
                document.getElementById('errorMessage').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('scheduleContent').style.display = 'block';
            }
        }

        function displaySchedule() {
            const scheduleBody = document.getElementById('scheduleBody');
            scheduleBody.innerHTML = '';
            
            timeSlots.forEach(timeSlot => {
                const row = document.createElement('tr');
                
                // Time slot cell
                const timeCell = document.createElement('td');
                timeCell.className = 'time-slot';
                timeCell.textContent = timeSlot;
                row.appendChild(timeCell);
                
                // Day cells (Monday to Friday)
                const days = ['MO', 'TU', 'WE', 'TH', 'FR'];
                days.forEach(day => {
                    const dayCell = document.createElement('td');
                    dayCell.className = 'course-cell empty';
                    
                    // Find course for this time slot and day
                    const course = allCourses.find(c => 
                        registeredCourses.includes(c.id) &&
                        c.day === day &&
                        isTimeInSlot(c.time, timeSlot)
                    );
                    
                    if (course) {
                        dayCell.className = 'course-cell';
                        dayCell.innerHTML = `
                            <div class="course-code">${course.course_code}</div>
                            <div class="course-name">${course.course_name}</div>
                            <div class="course-time">${course.time}</div>
                            <div class="course-room">ห้อง: ${course.room || 'TBD'}</div>
                        `;
                    }
                    
                    row.appendChild(dayCell);
                });
                
                scheduleBody.appendChild(row);
            });
        }

        function isTimeInSlot(courseTime, timeSlot) {
            // Parse course time (e.g., "09:00 - 11:00")
            const [startTime, endTime] = courseTime.split(' - ');
            const [slotStart, slotEnd] = timeSlot.split(' - ');
            
            // Check if course time overlaps with time slot
            return (startTime < slotEnd && endTime > slotStart);
        }

        function updateSummary() {
            const registeredCourseDetails = allCourses.filter(c => 
                registeredCourses.includes(c.id)
            );
            
            // Total courses
            document.getElementById('totalCourses').textContent = registeredCourseDetails.length;
            
            // Total credits
            const totalCredits = registeredCourseDetails.reduce((sum, course) => 
                sum + course.credits, 0
            );
            document.getElementById('totalCredits').textContent = totalCredits;
            
            // Total hours (assuming 1 credit = 1 hour per week)
            document.getElementById('totalHours').textContent = totalCredits;
            
            // Free days
            const daysWithCourses = new Set();
            registeredCourseDetails.forEach(course => {
                daysWithCourses.add(course.day);
            });
            const freeDays = 5 - daysWithCourses.size;
            document.getElementById('freeDays').textContent = freeDays;
        }

        function logout() {
            auth.signOut().then(() => {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }).catch((error) => {
                console.error('Logout error:', error);
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
